name = "crowth"
compatibility_date = "2026-08-22"
main = "workers/api-proxy.ts"
workers_dev = true
preview_urls = true

# Product domain (Cloudflare Registrar)
[[routes]]
pattern = "crowthza.app"
custom_domain = true

[[routes]]
pattern = "www.crowthza.app"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Worker must run first for HTML so Supabase secrets can be injected into the SPA
run_worker_first = true

# Cloudflare Workers AI (Llama etc.) for /api/ai/chat
[ai]
binding = "AI"

# Secrets (set via dashboard or CLI — do not commit values):
#   npx wrangler secret put FINNHUB_API_KEY
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_ANON_KEY
#   npx wrangler secret put GOOGLE_WEB_CLIENT_ID
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#
# Optional legacy Railway fallback (unused when native API is live):
#   MARKET_API_ORIGIN
