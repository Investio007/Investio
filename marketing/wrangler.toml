# Marketing site for crowthza.com (separate from product Worker `crowth` on crowthza.app)
name = "crowth-marketing"
compatibility_date = "2026-08-22"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "crowthza.com"
custom_domain = true

[[routes]]
pattern = "www.crowthza.com"
custom_domain = true
